<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Recovery Pro - Military Grade Matrix</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Orbitron:wght@500;700;900&family=Share+Tech+Mono&display=swap" rel="stylesheet">
  <style>
    :root {
      --neon-blue: #00D2FF;
      --deep-neon: #0072FF;
      --bg-dark: #02060F;
    }

    body {
      background: radial-gradient(circle at 50% 50%, #051329 0%, var(--bg-dark) 100%);
      color: #e2e8f0;
      font-family: 'Share Tech Mono', monospace;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
      margin: 0;
      overflow-x: hidden;
    }

    .glass-card {
      background: rgba(2, 12, 27, 0.85);
      backdrop-filter: blur(16px);
      -webkit-backdrop-filter: blur(16px);
      border: 1px solid rgba(0, 210, 255, 0.35);
      box-shadow: 0 0 35px rgba(0, 114, 255, 0.2), inset 0 0 20px rgba(0, 210, 255, 0.05);
      border-radius: 20px;
      position: relative;
      overflow: hidden;
    }

    .sci-fi-title {
      font-family: 'Orbitron', sans-serif;
      letter-spacing: 2px;
      text-shadow: 0 0 12px rgba(0, 210, 255, 0.6);
    }

    .cyber-input {
      background: rgba(1, 8, 18, 0.85);
      border: 1px solid rgba(0, 210, 255, 0.4);
      color: var(--neon-blue);
      font-family: 'Share Tech Mono', monospace;
      transition: all 0.3s ease;
    }
    .cyber-input:focus {
      outline: none;
      border-color: var(--neon-blue);
      box-shadow: 0 0 20px rgba(0, 210, 255, 0.5);
    }

    .mode-btn {
      background: rgba(1, 8, 18, 0.9);
      border: 1px solid rgba(0, 114, 255, 0.4);
      color: #94a3b8;
      font-family: 'Orbitron', sans-serif;
      transition: all 0.3s ease;
    }
    .mode-btn.active {
      background: linear-gradient(135deg, rgba(0, 210, 255, 0.25) 0%, rgba(0, 114, 255, 0.35) 100%);
      border-color: var(--neon-blue);
      color: var(--neon-blue);
      box-shadow: 0 0 15px rgba(0, 210, 255, 0.4);
    }

    .btn-execute {
      background: linear-gradient(135deg, var(--neon-blue) 0%, var(--deep-neon) 100%);
      font-family: 'Orbitron', sans-serif;
      box-shadow: 0 4px 25px rgba(0, 210, 255, 0.4);
      transition: all 0.3s ease;
    }
    .btn-execute:hover:not(:disabled) {
      transform: translateY(-2px);
      box-shadow: 0 0 30px rgba(0, 210, 255, 0.8);
    }

    .btn-cancel {
      background: linear-gradient(135deg, #ef4444 0%, #991b1b 100%);
      font-family: 'Orbitron', sans-serif;
      box-shadow: 0 4px 15px rgba(239, 68, 68, 0.4);
      transition: all 0.3s ease;
    }
    .btn-cancel:hover {
      box-shadow: 0 0 25px rgba(239, 68, 68, 0.8);
      transform: translateY(-1px);
    }

    @keyframes pulseWave {
      0% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0.7); }
      70% { box-shadow: 0 0 0 20px rgba(0, 210, 255, 0); }
      100% { box-shadow: 0 0 0 0 rgba(0, 210, 255, 0); }
    }
    .pulse-active {
      animation: pulseWave 1.5s infinite;
    }

    @keyframes scanLaser {
      0% { top: 0%; opacity: 0.8; }
      50% { opacity: 1; }
      100% { top: 100%; opacity: 0.8; }
    }
    .laser-line {
      position: absolute;
      left: 0;
      right: 0;
      height: 2px;
      background: var(--neon-blue);
      box-shadow: 0 0 15px #00d2ff, 0 0 30px #0072ff;
      animation: scanLaser 2s linear infinite;
      pointer-events: none;
      display: none;
    }

    #matrixCanvas {
      background: #01060e;
      border: 1px solid rgba(0, 210, 255, 0.3);
      border-radius: 12px;
      width: 100%;
      height: 220px;
    }

    /* Congratulatory Popup Modal Styles */
    .popup-overlay {
      position: fixed;
      inset: 0;
      background: rgba(2, 6, 15, 0.85);
      backdrop-filter: blur(8px);
      z-index: 100;
      display: flex;
      justify-content: center;
      align-items: center;
      opacity: 0;
      pointer-events: none;
      transition: all 0.4s ease;
    }
    .popup-overlay.active {
      opacity: 1;
      pointer-events: auto;
    }
    .popup-box {
      background: linear-gradient(135deg, rgba(2, 12, 27, 0.95) 0%, rgba(5, 30, 60, 0.95) 100%);
      border: 2px solid #10B981;
      box-shadow: 0 0 50px rgba(16, 185, 129, 0.4), inset 0 0 20px rgba(16, 185, 129, 0.2);
      border-radius: 24px;
      padding: 2.5rem;
      max-width: 420px;
      width: 90%;
      text-align: center;
      transform: scale(0.8);
      transition: all 0.4s cubic-bezier(0.34, 1.56, 0.64, 1);
    }
    .popup-overlay.active .popup-box {
      transform: scale(1);
    }
  </style>
</head>
<body>

  <!-- Scanning Laser Overlay Element -->
  <div id="laser" class="laser-line"></div>

  <!-- CONGRATULATIONS POPUP MODAL -->
  <div id="congratsPopup" class="popup-overlay">
    <div class="popup-box space-y-4">
      <div class="w-16 h-16 mx-auto bg-emerald-500/20 border-2 border-emerald-400 rounded-full flex items-center justify-center shadow-[0_0_20px_rgba(16,185,129,0.6)]">
        <i class="fa-solid fa-award text-3xl text-emerald-400 animate-bounce"></i>
      </div>
      <div>
        <h3 class="font-['Orbitron'] font-black text-xl text-emerald-400 tracking-wider">CONGRATULATIONS!</h3>
        <p class="text-xs text-slate-300 mt-1 font-['Share+Tech+Mono']">PDF DECRYPTION SUCCESSFUL</p>
      </div>
      <div id="popupKeyDisplay" class="bg-emerald-950/40 border border-emerald-500/40 py-2.5 px-4 rounded-xl text-emerald-300 font-bold text-sm tracking-widest">
        KEY: --
      </div>
      <button type="button" onclick="closePopup()" class="w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-white font-['Orbitron'] font-black rounded-xl text-xs tracking-wider shadow-[0_0_15px_rgba(16,185,129,0.5)] hover:scale-[1.02] transition">
        PROCEED TO DASHBOARD
      </button>
    </div>
  </div>

  <div class="w-full max-w-5xl space-y-6 relative z-10">
    
    <!-- HEADER -->
    <div class="text-center pb-2 border-b border-cyan-500/20">
      <h1 class="sci-fi-title text-2xl font-black text-cyan-400 tracking-widest">PDF RECOVERY PROTOCOL</h1>
      <p class="text-xs text-cyan-300/70 tracking-widest mt-1">MILITARY DECRYPTION MATRIX & CONTROL SUITE</p>
    </div>

    <!-- MAIN TWO-COLUMN DASHBOARD GRID -->
    <div class="grid grid-cols-1 lg:grid-cols-12 gap-6">
      
      <!-- LEFT PANEL: CONTROL INPUTS -->
      <div class="lg:col-span-6 glass-card p-6 space-y-5">
        
        <!-- MODE SELECTION -->
        <div>
          <label class="text-xs font-bold text-cyan-400 block mb-2 font-['Orbitron'] tracking-wider">⚙️ RECOVERY MODE</label>
          <div class="grid grid-cols-2 gap-3">
            <button type="button" id="m1" onclick="setMode('name_digits')" class="mode-btn active py-3 px-3 rounded-xl text-xs font-bold min-h-[48px]">Name + 4 Digits</button>
            <button type="button" id="m2" onclick="setMode('numeric_8')" class="mode-btn py-3 px-3 rounded-xl text-xs font-bold min-h-[48px]">8-Digit Numbers</button>
          </div>
        </div>

        <!-- FILE UPLOAD -->
        <div>
          <label class="text-xs font-bold text-cyan-400 block mb-2 font-['Orbitron'] tracking-wider">📄 ENCRYPTED PAYLOAD</label>
          <div onclick="document.getElementById('pdfFile').click()" class="border-2 border-dashed border-cyan-500/40 rounded-xl p-5 text-center bg-cyan-950/10 cursor-pointer min-h-[52px] flex flex-col justify-center items-center hover:border-cyan-400 transition group">
            <i class="fa-solid fa-file-shield text-2xl text-cyan-400 mb-1 group-hover:scale-110 transition drop-shadow-[0_0_8px_rgba(0,210,255,0.8)]"></i>
            <p id="fileLabel" class="text-xs text-slate-300 font-semibold">Upload target encrypted PDF</p>
            <input type="file" id="pdfFile" accept="application/pdf" class="hidden" required onchange="updateFileLabel(this)">
          </div>
        </div>

        <!-- HINT INPUT -->
        <div id="hintBox">
          <label class="text-xs font-bold text-cyan-400 block mb-2 font-['Orbitron'] tracking-wider">💡 TARGET HINT (UPPERCASE)</label>
          <input type="text" id="hintInput" placeholder="E.G. VIKAS" oninput="handleRealtimeInput(this)" class="cyber-input w-full px-4 py-3 rounded-xl text-sm font-bold uppercase tracking-widest">
        </div>

        <!-- SUBMIT & CANCEL BUTTON GRID -->
        <div class="grid grid-cols-1 sm:grid-cols-12 gap-3 pt-2">
          <button type="button" id="subBtn" onclick="startLiveRecovery()" class="sm:col-span-8 btn-execute w-full rounded-xl text-white font-black text-xs tracking-widest py-4 flex items-center justify-center gap-2">
            <i class="fa-solid fa-microchip text-cyan-200"></i>
            <span id="btnText">EXECUTE ENGINE</span>
          </button>
          <button type="button" id="cancelBtn" onclick="cancelRecovery()" disabled class="sm:col-span-4 btn-cancel w-full rounded-xl text-white font-black text-xs tracking-widest py-4 flex items-center justify-center gap-2 opacity-50 cursor-not-allowed">
            <i class="fa-solid fa-ban"></i>
            <span>CANCEL</span>
          </button>
        </div>

      </div>

      <!-- RIGHT PANEL: DYNAMIC MATRIX FEED & RESULT PANEL -->
      <div class="lg:col-span-6 glass-card p-6 flex flex-col justify-between space-y-4">
        <div>
          <div class="flex justify-between items-center text-xs text-cyan-400 font-['Orbitron'] mb-3">
            <span><i class="fa-solid fa-terminal"></i> HACKER STREAM FEED</span>
            <span id="engineStatusBadge" class="text-slate-500 font-bold">STANDBY</span>
          </div>
          
          <!-- Canvas Matrix Code Rain / Hex Stream -->
          <div class="relative">
            <canvas id="matrixCanvas"></canvas>
          </div>
        </div>

        <div id="downloadContainer" class="w-full"></div>
      </div>

    </div>
  </div>

  <script>
    let currentMode = 'name_digits';
    let canvas, ctx, animationFrameId;
    let abortController = null;
    let lastRenderTime = 0;

    function setMode(m) {
      currentMode = m;
      if(m === 'name_digits') {
        document.getElementById('m1').classList.add('active');
        document.getElementById('m2').classList.remove('active');
        document.getElementById('hintBox').style.display = 'block';
      } else {
        document.getElementById('m2').classList.add('active');
        document.getElementById('m1').classList.remove('active');
        document.getElementById('hintBox').style.display = 'none';
      }
      resizeObserver();
    }

    function updateFileLabel(input) {
      if(input.files[0]) {
        document.getElementById('fileLabel').innerText = input.files[0].name;
      }
    }

    function handleRealtimeInput(input) {
      input.value = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    }

    function resizeObserver() {
      const height = document.body.scrollHeight;
      window.parent.postMessage({ type: 'resize', height: height }, '*');
    }
    window.addEventListener('load', () => {
      initMatrixCanvasStandby();
      resizeObserver();
    });

    function initMatrixCanvasStandby() {
      canvas = document.getElementById('matrixCanvas');
      ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = 220;

      ctx.fillStyle = "#01060E";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "rgba(0, 210, 255, 0.4)";
      ctx.font = "13px 'Share Tech Mono', monospace";
      ctx.fillText("> SYSTEM READY. WAITING FOR EXECUTION...", 20, 110);
    }

    function initMatrixCanvas() {
      canvas = document.getElementById('matrixCanvas');
      ctx = canvas.getContext('2d');
      canvas.width = canvas.parentElement.clientWidth;
      canvas.height = 220;

      const chars = "01ABCDEFXYZ00210A7F9";
      const fontSize = 13;
      const columns = Math.floor(canvas.width / fontSize);
      const drops = [];
      for (let i = 0; i < columns; i++) {
        drops[i] = 1;
      }

      function draw(timestamp) {
        if (timestamp - lastRenderTime < 33) {
          animationFrameId = requestAnimationFrame(draw);
          return;
        }
        lastRenderTime = timestamp;

        ctx.fillStyle = "rgba(1, 6, 14, 0.25)";
        ctx.fillRect(0, 0, canvas.width, canvas.height);

        ctx.fillStyle = "#00D2FF";
        ctx.font = fontSize + "px 'Share Tech Mono', monospace";

        for (let i = 0; i < drops.length; i++) {
          const text = chars.charAt(Math.floor(Math.random() * chars.length));
          ctx.fillText(text, i * fontSize, drops[i] * fontSize);

          if (drops[i] * fontSize > canvas.height && Math.random() > 0.975) {
            drops[i] = 0;
          }
          drops[i]++;
        }
        animationFrameId = requestAnimationFrame(draw);
      }
      animationFrameId = requestAnimationFrame(draw);
    }

    function cancelRecovery() {
      if (abortController) {
        abortController.abort();
      }
      stopAnimations();
      
      const engineStatusBadge = document.getElementById('engineStatusBadge');
      engineStatusBadge.className = "text-amber-500 font-bold";
      engineStatusBadge.innerText = "CANCELLED";

      ctx.fillStyle = "#01060E";
      ctx.fillRect(0, 0, canvas.width, canvas.height);
      ctx.fillStyle = "#F59E0B";
      ctx.font = "13px 'Orbitron', sans-serif";
      ctx.fillText("[!] PROCESS CANCELLED BY USER", 20, 110);
    }

    function closePopup() {
      document.getElementById('congratsPopup').classList.remove('active');
    }

    function stopAnimations() {
      if(animationFrameId) cancelAnimationFrame(animationFrameId);
      document.getElementById('laser').style.display = 'none';

      const subBtn = document.getElementById('subBtn');
      subBtn.disabled = false;
      subBtn.classList.remove('opacity-50', 'cursor-not-allowed', 'pulse-active');

      const cancelBtn = document.getElementById('cancelBtn');
      cancelBtn.disabled = true;
      cancelBtn.classList.add('opacity-50', 'cursor-not-allowed');
    }

    async function startLiveRecovery() {
      const fileInput = document.getElementById('pdfFile');
      if(!fileInput.files[0]) {
        alert('Please upload an encrypted PDF payload first!');
        return;
      }

      const subBtn = document.getElementById('subBtn');
      subBtn.disabled = true;
      subBtn.classList.add('opacity-50', 'cursor-not-allowed', 'pulse-active');

      const cancelBtn = document.getElementById('cancelBtn');
      cancelBtn.disabled = false;
      cancelBtn.classList.remove('opacity-50', 'cursor-not-allowed');

      document.getElementById('laser').style.display = 'block';
      const engineStatusBadge = document.getElementById('engineStatusBadge');
      engineStatusBadge.className = "text-amber-400 font-bold animate-pulse";
      engineStatusBadge.innerText = "DECRYPTING...";
      document.getElementById('downloadContainer').innerHTML = "";
      
      initMatrixCanvas();
      resizeObserver();

      abortController = new AbortController();

      const formData = new FormData();
      formData.append('pdf', fileInput.files[0]);
      formData.append('mode', currentMode);
      formData.append('hint', document.getElementById('hintInput').value);

      try {
        const response = await fetch('/stream-recover', { 
          method: 'POST', 
          body: formData,
          signal: abortController.signal
        });
        
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop();

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.substring(6));

              if (data.status === 'success') {
                stopAnimations();

                engineStatusBadge.className = "text-emerald-400 font-bold drop-shadow-[0_0_8px_rgba(16,185,129,0.8)]";
                engineStatusBadge.innerText = "SUCCESSFUL";
                
                ctx.fillStyle = "#01060E";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#10B981";
                ctx.font = "14px 'Orbitron', sans-serif";
                ctx.fillText(`KEY: ${data.password}`, 20, 90);
                ctx.fillStyle = "#00D2FF";
                ctx.font = "12px 'Share Tech Mono', monospace";
                ctx.fillText(`TIME ELAPSED: ${data.elapsed}s`, 20, 130);

                document.getElementById('downloadContainer').innerHTML = `
                  <a href="data:application/pdf;base64,${data.pdf_data}" download="Unlocked_${data.password}.pdf" class="block w-full py-3.5 bg-gradient-to-r from-emerald-600 to-teal-600 text-center font-['Orbitron'] font-black rounded-xl text-white text-xs tracking-wider shadow-[0_0_20px_rgba(16,185,129,0.5)] hover:scale-[1.02] transition">
                    📥 DOWNLOAD UNLOCKED PDF (${data.password})
                  </a>
                `;

                // Show Congratulatory Popup Modal with Best CSS Logo & Key
                document.getElementById('popupKeyDisplay').innerText = `KEY: ${data.password}`;
                document.getElementById('congratsPopup').classList.add('active');

                resizeObserver();
                return;
              } 
              else if (data.status === 'failed' || data.status === 'error') {
                stopAnimations();

                engineStatusBadge.className = "text-red-500 font-bold";
                engineStatusBadge.innerText = "FAILED";
                
                ctx.fillStyle = "#01060E";
                ctx.fillRect(0, 0, canvas.width, canvas.height);
                ctx.fillStyle = "#EF4444";
                ctx.font = "13px 'Orbitron', sans-serif";
                ctx.fillText(`[X] MATCH NOT FOUND`, 20, 110);

                resizeObserver();
                return;
              }
            }
          }
        }
      } catch (err) {
        if (err.name === 'AbortError') {
          console.log('User cancelled the process.');
        } else {
          stopAnimations();
        }
      }
      resizeObserver();
    }
  </script>
</body>
</html>
