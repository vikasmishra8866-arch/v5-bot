<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Vikas Mishra | Ultra Recovery Pro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Fira+Code:wght@500;700&family=Inter:wght@400;600;800;900&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #0d284f 0%, #031329 85%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1.5rem;
    }
    .hydro-card {
      background: #0b1d3a;
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow: 0 15px 35px rgba(0, 0, 0, 0.6);
      border-radius: 20px;
    }
    .cyber-input {
      background: rgba(3, 19, 41, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #38bdf8;
    }
    .btn-cyber {
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
      box-shadow: 0 0 20px rgba(6, 182, 212, 0.4);
    }
    .tv-terminal {
      background: #020b14;
      border: 2px solid #06b6d4;
      font-family: 'Fira Code', monospace;
      color: #00ff66;
    }
  </style>
</head>
<body>

  <div class="w-full max-w-xl space-y-5">
    <!-- HEADER -->
    <div class="hydro-card p-6 text-center">
      <h1 class="text-3xl font-black tracking-widest text-amber-400">ULTRA RECOVERY PRO</h1>
      <p class="text-xs text-slate-400 mt-2">💎 Managed by: <span class="text-amber-400 font-bold">VIKAS MISHRA</span></p>
    </div>

    <!-- MAIN FORM -->
    <form id="recoveryForm" class="hydro-card p-6 space-y-5" onsubmit="handleRecovery(event)">
      <!-- MODE -->
      <div>
        <label class="text-xs font-bold text-cyan-400 block mb-2">⚙️ RECOVERY MODE SELECTION</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="m1" onclick="setMode('name_digits')" class="py-3 px-4 rounded-xl text-xs font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-300">Name + 4 Digits</button>
          <button type="button" id="m2" onclick="setMode('numeric_8')" class="py-3 px-4 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-slate-400">8-Digit Numbers</button>
        </div>
        <input type="hidden" id="selectedMode" value="name_digits">
      </div>

      <!-- FILE UPLOAD -->
      <div>
        <label class="text-xs font-bold text-cyan-400 block mb-2">📄 UPLOAD ENCRYPTED PDF</label>
        <div onclick="document.getElementById('pdfFile').click()" class="border-2 border-dashed border-cyan-500/40 rounded-xl p-6 text-center bg-cyan-950/20 cursor-pointer">
          <i class="fa-solid fa-cloud-arrow-up text-3xl text-cyan-400 mb-2"></i>
          <p id="fileLabel" class="text-xs text-slate-300 font-semibold">Click to upload PDF</p>
          <input type="file" id="pdfFile" accept="application/pdf" class="hidden" required onchange="document.getElementById('fileLabel').innerText = this.files[0].name">
        </div>
      </div>

      <!-- HINT -->
      <div id="hintBox">
        <label class="text-xs font-bold text-cyan-400 block mb-2">💡 NAME HINT</label>
        <input type="text" id="hintInput" placeholder="TYPE NAME HINT (E.G. VIKAS)" class="cyber-input w-full px-4 py-3 rounded-xl text-sm font-bold uppercase">
      </div>

      <button type="submit" id="subBtn" class="btn-cyber w-full py-4 rounded-xl text-white font-black text-sm tracking-wider flex items-center justify-center gap-2">
        <i class="fa-solid fa-bolt text-amber-300"></i>
        <span>EXECUTE RECOVERY ENGINE</span>
      </button>
    </form>

    <!-- TERMINAL -->
    <div id="terminal" class="hydro-card p-4 space-y-2 hidden">
      <div class="flex justify-between items-center text-xs text-cyan-400 font-mono">
        <span><i class="fa-solid fa-terminal"></i> ENGINE STATUS</span>
        <span class="animate-pulse text-emerald-400">● PROCESSING</span>
      </div>
      <div class="tv-terminal p-4 text-xs space-y-1" id="logs">
        <div>> [SYSTEM_INIT] Booting Decryption Engine...</div>
      </div>
      <div id="downloadBox" class="pt-2 hidden"></div>
    </div>
  </div>

  <script>
    let currentMode = 'name_digits';

    function setMode(m) {
      currentMode = m;
      document.getElementById('selectedMode').value = m;
      if(m === 'name_digits') {
        document.getElementById('m1').className = "py-3 px-4 rounded-xl text-xs font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-300";
        document.getElementById('m2').className = "py-3 px-4 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-slate-400";
        document.getElementById('hintBox').style.display = 'block';
      } else {
        document.getElementById('m2').className = "py-3 px-4 rounded-xl text-xs font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-300";
        document.getElementById('m1').className = "py-3 px-4 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-slate-400";
        document.getElementById('hintBox').style.display = 'none';
      }
    }

    async function handleRecovery(e) {
      e.preventDefault();
      const fileInput = document.getElementById('pdfFile');
      if(!fileInput.files[0]) return;

      document.getElementById('terminal').classList.remove('hidden');
      document.getElementById('subBtn').disabled = true;

      const formData = new FormData();
      formData.append('pdf', fileInput.files[0]);
      formData.append('mode', currentMode);
      formData.append('hint', document.getElementById('hintInput').value);

      const response = await fetch('/recover', { method: 'POST', body: formData });
      const res = await response.json();

      document.getElementById('subBtn').disabled = false;

      if(res.success) {
        document.getElementById('logs').innerHTML = `
          <div class="text-emerald-400 font-bold">> [SUCCESS] UNLOCKED!</div>
          <div>> Found Password: <span class="text-amber-300 font-bold">${res.password}</span></div>
          <div>> Time Taken: ${res.elapsed}s</div>
        `;
        document.getElementById('downloadBox').classList.remove('hidden');
        document.getElementById('downloadBox').innerHTML = `
          <a href="data:application/pdf;base64,${res.pdf_data}" download="Unlocked_${res.password}.pdf" class="block w-full py-3 bg-emerald-500 text-center font-black rounded-xl text-white">
            📥 DOWNLOAD UNLOCKED PDF
          </a>
        `;
      } else {
        document.getElementById('logs').innerHTML = `<div class="text-red-400">> [FAILED] ${res.message}</div>`;
      }
    }
  </script>
</body>
</html>
