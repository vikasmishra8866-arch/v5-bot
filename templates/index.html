<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>PDF Recovery Pro - Deep Ocean Hydro</title>
  <script src="https://cdn.tailwindcss.com"></script>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;600;800;900&family=JetBrains+Mono:wght@400;700&display=swap" rel="stylesheet">
  <style>
    body {
      background: radial-gradient(circle at 50% 0%, #031329 0%, #010814 100%);
      color: #f8fafc;
      font-family: 'Inter', sans-serif;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      padding: 1rem;
      margin: 0;
    }
    .hydro-card {
      background: linear-gradient(135deg, rgba(11, 29, 58, 0.95) 0%, rgba(5, 15, 30, 0.98) 100%);
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.15), inset 0 0 15px rgba(6, 182, 212, 0.05);
      border-radius: 24px;
      animation: fadeInUp 0.6s ease-out forwards;
      backdrop-filter: blur(12px);
    }
    @keyframes fadeInUp {
      from { opacity: 0; transform: translateY(12px) scale(0.98); }
      to { opacity: 1; transform: translateY(0) scale(1); }
    }
    .cyber-input {
      background: rgba(3, 19, 41, 0.9);
      border: 1px solid rgba(6, 182, 212, 0.4);
      color: #22d3ee;
      min-height: 48px;
    }
    .cyber-input:focus {
      outline: none;
      border-color: #06b6d4;
      box-shadow: 0 0 15px rgba(6, 182, 212, 0.5);
    }
    .btn-cyber {
      background: linear-gradient(135deg, #06b6d4 0%, #0284c7 100%);
      min-height: 48px;
      box-shadow: 0 4px 20px rgba(6, 182, 212, 0.4);
      transition: all 0.3s ease;
    }
    .btn-cyber:hover:not(:disabled) {
      transform: scale(1.02);
      box-shadow: 0 0 25px rgba(6, 182, 212, 0.7);
    }
    .terminal-box {
      font-family: 'JetBrains Mono', monospace;
      background: #020617;
      border: 1px solid rgba(6, 182, 212, 0.3);
      box-shadow: inset 0 0 10px rgba(0, 0, 0, 0.8);
    }
  </style>
</head>
<body>

  <div class="w-full max-w-lg space-y-4">
    <div class="hydro-card p-6 space-y-5">
      
      <!-- HEADER TITLE -->
      <div class="text-center pb-2 border-b border-cyan-500/20">
        <h1 class="text-xl font-black tracking-widest text-cyan-400 drop-shadow-[0_0_10px_rgba(6,182,212,0.5)]">ULTRA RECOVERY SUITE</h1>
        <p class="text-xs text-slate-400 mt-1">SECURE DECRYPTION ENGINE</p>
      </div>

      <!-- MODE SELECTION -->
      <div>
        <label class="text-xs font-bold text-cyan-400 block mb-2">⚙️ RECOVERY MODE SELECTION</label>
        <div class="grid grid-cols-2 gap-3">
          <button type="button" id="m1" onclick="setMode('name_digits')" class="py-3 px-4 rounded-xl text-xs font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-300 min-h-[48px]">Name + 4 Digits</button>
          <button type="button" id="m2" onclick="setMode('numeric_8')" class="py-3 px-4 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-slate-400 min-h-[48px]">8-Digit Numbers</button>
        </div>
      </div>

      <!-- FILE UPLOAD -->
      <div>
        <label class="text-xs font-bold text-cyan-400 block mb-2">📄 UPLOAD ENCRYPTED PDF</label>
        <div onclick="document.getElementById('pdfFile').click()" class="border-2 border-dashed border-cyan-500/40 rounded-xl p-5 text-center bg-cyan-950/20 cursor-pointer min-h-[48px] flex flex-col justify-center items-center hover:border-cyan-400 transition">
          <i class="fa-solid fa-cloud-arrow-up text-2xl text-cyan-400 mb-1 drop-shadow-[0_0_8px_rgba(6,182,212,0.6)]"></i>
          <p id="fileLabel" class="text-xs text-slate-300 font-semibold">Click or drop encrypted PDF here</p>
          <input type="file" id="pdfFile" accept="application/pdf" class="hidden" required onchange="updateFileLabel(this)">
        </div>
      </div>

      <!-- HINT INPUT -->
      <div id="hintBox">
        <label class="text-xs font-bold text-cyan-400 block mb-2">💡 NAME HINT (UPPERCASE ONLY)</label>
        <input type="text" id="hintInput" placeholder="E.G. VIKAS" oninput="handleRealtimeInput(this)" class="cyber-input w-full px-4 rounded-xl text-sm font-bold uppercase">
      </div>

      <!-- SUBMIT BUTTON -->
      <button type="button" id="subBtn" onclick="startLiveRecovery()" class="btn-cyber w-full rounded-xl text-white font-black text-sm tracking-wider flex items-center justify-center gap-2">
        <i class="fa-solid fa-bolt text-amber-300"></i>
        <span id="btnText">EXECUTE RECOVERY ENGINE</span>
      </button>
    </div>

    <!-- LIVE TERMINAL & RESULT PANEL -->
    <div id="resultCard" class="hydro-card p-5 space-y-3 hidden">
      <div class="flex justify-between items-center text-xs text-cyan-400 font-mono">
        <span><i class="fa-solid fa-terminal"></i> LIVE SATELLITE FEED</span>
        <span id="engineStatusBadge" class="text-amber-400 font-bold animate-pulse">SCANNING...</span>
      </div>
      
      <!-- Live Coding Matrix Box -->
      <div id="logContent" class="terminal-box p-3 rounded-xl h-28 overflow-y-auto text-xs flex flex-col space-y-1">
        <span class="text-slate-500">> Initializing security bypass protocols...</span>
      </div>
      
      <div id="downloadContainer"></div>
    </div>
  </div>

  <script>
    let currentMode = 'name_digits';

    function setMode(m) {
      currentMode = m;
      if(m === 'name_digits') {
        document.getElementById('m1').className = "py-3 px-4 rounded-xl text-xs font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-300 min-h-[48px]";
        document.getElementById('m2').className = "py-3 px-4 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-slate-400 min-h-[48px]";
        document.getElementById('hintBox').style.display = 'block';
      } else {
        document.getElementById('m2').className = "py-3 px-4 rounded-xl text-xs font-bold bg-cyan-500/20 border border-cyan-400 text-cyan-300 min-h-[48px]";
        document.getElementById('m1').className = "py-3 px-4 rounded-xl text-xs font-bold bg-slate-900 border border-slate-700 text-slate-400 min-h-[48px]";
        document.getElementById('hintBox').style.display = 'none';
      }
      resizeObserver();
    }

    function updateFileLabel(input) {
      if(input.files[0]) {
        document.getElementById('fileLabel').innerText = input.files[0].name;
      }
    }

    function handleRealtimeInput(input) {
      input.value = input.value.replace(/[^a-zA-Z0-9]/g, '').toUpperCase();
    }

    function resizeObserver() {
      const height = document.body.scrollHeight;
      window.parent.postMessage({ type: 'resize', height: height }, '*');
    }
    window.addEventListener('load', resizeObserver);

    async function startLiveRecovery() {
      const fileInput = document.getElementById('pdfFile');
      if(!fileInput.files[0]) {
        alert('Please upload a PDF file first!');
        return;
      }

      const subBtn = document.getElementById('subBtn');
      subBtn.disabled = true;
      subBtn.classList.add('opacity-50', 'cursor-not-allowed');

      const resultCard = document.getElementById('resultCard');
      const logContent = document.getElementById('logContent');
      const engineStatusBadge = document.getElementById('engineStatusBadge');
      
      resultCard.classList.remove('hidden');
      logContent.innerHTML = `<span class="text-slate-400">> Target loaded. Starting high-speed brute-force matrix...</span>`;
      engineStatusBadge.className = "text-amber-400 font-bold animate-pulse";
      engineStatusBadge.innerText = "SCANNING...";
      document.getElementById('downloadContainer').innerHTML = "";
      resizeObserver();

      const formData = new FormData();
      formData.append('pdf', fileInput.files[0]);
      formData.append('mode', currentMode);
      formData.append('hint', document.getElementById('hintInput').value);

      try {
        const response = await fetch('/stream-recover', { method: 'POST', body: formData });
        const reader = response.body.getReader();
        const decoder = new TextDecoder();
        let buffer = '';

        while (true) {
          const { value, done } = await reader.read();
          if (done) break;
          
          buffer += decoder.decode(value, { stream: true });
          const lines = buffer.split('\n\n');
          buffer = lines.pop(); // keep last incomplete chunk

          for (const line of lines) {
            if (line.startsWith('data: ')) {
              const data = JSON.parse(line.substring(6));

              if (data.status === 'testing') {
                // RED/CYAN Live Coding stream output
                logContent.innerHTML += `<div class="text-red-400 font-mono text-[11px]">> TESTING KEY: <span class="text-cyan-300">${data.pass}</span></div>`;
                logContent.scrollTop = logContent.scrollHeight;
              } 
              else if (data.status === 'success') {
                // STOP SCREEN & SHOW GREEN SUCCESS
                engineStatusBadge.className = "text-emerald-400 font-bold";
                engineStatusBadge.innerText = "SECURED";
                
                logContent.innerHTML += `<div class="text-emerald-400 font-bold mt-2">> [SUCCESS] MATCH FOUND! Password: <span class="text-amber-300 text-sm">${data.password}</span> (Time: ${data.elapsed}s)</div>`;
                logContent.scrollTop = logContent.scrollHeight;

                document.getElementById('downloadContainer').innerHTML = `
                  <a href="data:application/pdf;base64,${data.pdf_data}" download="Unlocked_${data.password}.pdf" class="block w-full py-3 bg-gradient-to-r from-emerald-600 to-teal-600 text-center font-black rounded-xl text-white text-xs tracking-wider shadow-[0_0_15px_rgba(16,185,129,0.5)] hover:scale-[1.02] transition">
                    📥 DOWNLOAD UNLOCKED PDF (${data.password})
                  </a>
                `;

                subBtn.disabled = false;
                subBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                resizeObserver();
                return; // Stop processing loop instantly
              } 
              else if (data.status === 'failed') {
                engineStatusBadge.className = "text-red-500 font-bold";
                engineStatusBadge.innerText = "FAILED";
                logContent.innerHTML += `<div class="text-red-500 font-bold">> [X] Password not matched in database matrix.</div>`;
                subBtn.disabled = false;
                subBtn.classList.remove('opacity-50', 'cursor-not-allowed');
                return;
              }
            }
          }
        }
      } catch (err) {
        logContent.innerHTML += `<div class="text-red-500">> [ERROR] Stream connection terminated.</div>`;
        subBtn.disabled = false;
        subBtn.classList.remove('opacity-50', 'cursor-not-allowed');
      }
      resizeObserver();
    }
  </script>
</body>
</html>
